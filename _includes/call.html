<div class="call">
  <div class="call-box-top">
    {% if site.data.contact.phone %}
        <div class="call-phone"><strong>Phone: </strong> <a href="tel:{{ site.data.contact.phone_link }}">{{ site.data.contact.phone }}</a></div>
    {% endif %}
    <div class="call-email"><a href="{{ site.data.contact.contact_button_link | relative_url }}">Send us a message</a></div>
  </div>
    {% if include.show_button %}
      <div class="call-box-bottom">
        <a href="{{ site.data.contact.contact_button_link | relative_url }}" class="button">Contact</a>
      </div>
    {% endif %}
</div>
